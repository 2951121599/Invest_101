# GitHub Pages Jekyll 配置
title: Invest_101
description: 投资理财从零到一 - 完整开源学习体系
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Markdown 处理
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 排除文件
exclude:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - ROADMAP.md
  - .gitignore
  - .DS_Store

# 包含文件
include:
  - _pages

# 默认设置
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

