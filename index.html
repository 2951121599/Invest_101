<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Invest_101：投资理财从零到一</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #667eea;
      --sidebar-width: 300px;
    }
    
    .app-name-link img {
      max-width: 200px;
      margin: 0 auto;
    }
    
    .sidebar {
      background: #f8f9fa;
    }
    
    .sidebar ul li a {
      color: #333;
      font-weight: 500;
    }
    
    .sidebar ul li a:hover {
      color: #667eea;
    }
    
    .sidebar ul li.active > a {
      color: #667eea;
      font-weight: 600;
    }
    
    .markdown-section {
      max-width: 900px;
    }
    
    .markdown-section h1 {
      color: #667eea;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    
    .markdown-section h2 {
      color: #333;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
      margin-top: 30px;
    }
    
    .markdown-section a {
      color: #667eea;
    }
    
    .markdown-section a:hover {
      text-decoration: underline;
    }
    
    .markdown-section blockquote {
      border-left: 4px solid #667eea;
      background: #f8f9fa;
      padding: 15px 20px;
      margin: 20px 0;
    }
    
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }
    
    .markdown-section table th,
    .markdown-section table td {
      border: 1px solid #e0e0e0;
      padding: 12px;
      text-align: left;
    }
    
    .markdown-section table th {
      background: #f8f9fa;
      font-weight: 600;
    }
    
    .markdown-section code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    
    .markdown-section pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
    
    .warning-box {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-left: 4px solid #ffc107;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
    }
    
    .warning-box strong {
      color: #856404;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Invest_101',
      repo: 'https://github.com/2951121599/Invest_101',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      coverpage: false,
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '找不到结果',
        depth: 6
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(html) {
            // 添加警告框样式
            return html.replace(
              /<p><strong>⚠️ 重要提示<\/strong>/g,
              '<div class="warning-box"><strong>⚠️ 重要提示</strong>'
            ).replace(
              /<\/p>\n\n---/g,
              '</div>\n\n---'
            );
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
</body>
</html>
